<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify 2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="icon" href="./Spotify.png">
    <link rel="stylesheet" href="./CSS/style.css">
    <link rel="manifest" href="./manifest.json">
    <script type="module" src="./JS/main.js" defer></script>

</head>

<script>
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
            navigator.serviceWorker.register("./sw.js");
        });
    }
</script>

<body>
    <header>
        <div id="header">
            <div class="image">
                <img src="./Spotify.png" alt="Spotify2" draggable="false">
            </div>
            <div class="barra-pesquisa">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-search preview-icon">
                    <path d="m21 21-4.34-4.34" />
                    <circle cx="11" cy="11" r="8" />
                </svg>
                <input id="pesquisar" type="text" placeholder="Pesquisar música...">
            </div>
            <div>
            </div>
        </div>
    </header>

    <main>
        <div class="tela">
            <div class="biblioteca">
                <h1>Curtidas</h1>
                <button class="btnCriar" id="novaMusica">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-plus preview-icon">
                        <path d="M5 12h14" />
                        <path d="M12 5v14" />
                    </svg>
                    Criar
                </button>
                <ul id="listaCurtidas"></ul>
            </div>
            <div id="fundoTransparente">

                <button id="voltar"><svg width="100%" height="100%" viewBox="0 0 24 24" fill="none"
                        xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M12 8L8 12M8 12L12 16M8 12H16M22 12C22 17.5228 17.5228 22 12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12Z"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    </svg></button>

                <div id="formularioMusica">

                    <label for="titulo">Título</label>
                    <input type="text" id="titulo" placeholder="Insira o título...">

                    <label for="artista">Artista</label>
                    <input type="text" id="artista" placeholder="Insira o nome do artista...">

                    <label for="estilo">Estilo</label>
                    <input type="text" id="estilo" placeholder="Ex: Rock, MPB, RAP...">

                    <label for="capaURL">Capa</label>
                    <input type="file" id="capaURL" placeholder="">

                    <label for="audioURL">Link da Música</label>
                    <input type="file" id="audioURL" placeholder="Insira o link da música...">

                    <button class="salvarMusica" id="salvarMusica">Salvar</button>

                </div>
            </div>
            <div class="explorar">
                <h2 id="title">Músicas</h2>
                <ul id="listaMusicas"></ul>

            </div>
            <div class="descricao">
                <h1 id="descricao">Descrição</h1>
                <div id="conteudoDescricao"></div>
            </div>
        </div>
    </main>

    <footer>
        <audio id="player" controls></audio>
    </footer>
</body>

</html>
